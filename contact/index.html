<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Get in touch with Pedro Tavares" />
    <title>Contact - Pedro Tavares</title>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Contact</h1>
      </header>

      <main>
        <form method="POST" action="/api/contact">
          <p>
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required
            />
          </p>

          <p>
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="8"
              maxlength="5000"
              required
            ></textarea>
          </p>

          <p hidden>
            <label for="company">Leave this field empty</label>
            <input
              id="company"
              name="company"
              type="text"
              tabindex="-1"
              autocomplete="off"
            />
          </p>

          <p>Your message is emailed to me and only used to reply to you.</p>

          <p>
            <button type="submit">Send message</button>
          </p>
        </form>
      </main>
    </div>
  </body>
</html>
